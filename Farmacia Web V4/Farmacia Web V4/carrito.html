<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Pharma - Carrito de Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-plus"></i> Family Pharma
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Catálogo</a></li>
                <li><a href="index.html#nosotros">Nosotros</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
            </ul>
            <div class="nav-actions">
                <a href="favoritos.html" class="icon-btn" title="Favoritos"><i class="fa-regular fa-heart"></i><span class="badge" id="fav-badge">0</span></a>
                <a href="carrito.html" class="icon-btn" title="Carrito"><i class="fa-solid fa-bag-shopping" style="color:var(--primary)"></i><span class="badge" id="cart-badge">0</span></a>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 1000px;">
        <h2 class="section-title"><i class="fa-solid fa-bag-shopping"></i> Tu Carrito de Compras</h2>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; align-items: start;">
            <!-- Contenedor del Carrito -->
            <div id="cart-items-container" style="background: white; border-radius: var(--border-radius); padding: 1.5rem; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                <!-- Dinámico -->
            </div>

            <!-- Resumen -->
            <div style="background: white; border-radius: var(--border-radius); padding: 1.5rem; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                <h3 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--secondary-color);">Resumen del Pedido</h3>
                
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--text-muted);">
                    <span>Subtotal:</span>
                    <span id="summary-subtotal">$0.00 MXN</span>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--text-muted);">
                    <span>Envío:</span>
                    <span id="summary-shipping">$50.00 MXN</span>
                </div>

                <div id="discount-row" style="display: none; justify-content: space-between; margin-bottom: 0.8rem; font-size: 0.95rem; color: var(--accent-green); font-weight: 600;">
                    <span>Descuento (FAMILY10):</span>
                    <span id="summary-discount">-$0.00 MXN</span>
                </div>

                <hr style="border: none; border-top: 1px solid var(--border-color); margin: 1rem 0;">

                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem; font-size: 1.2rem; font-weight: bold; color: var(--secondary-color);">
                    <span>Total:</span>
                    <span id="summary-total" style="color: var(--primary);">$0.00 MXN</span>
                </div>

                <div style="margin-bottom: 1.5rem; display: flex; gap: 0.5rem;">
                    <input type="text" id="coupon-input" class="form-control" placeholder="Cupón (ej. FAMILY10)" style="font-size: 0.85rem;">
                    <button id="apply-coupon-btn" class="btn btn-outline" style="font-size: 0.85rem; white-space: nowrap;">Aplicar</button>
                </div>

                <button id="checkout-btn" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Proceder al Pago</button>
            </div>
        </div>
    </div>

    <!-- Modal Tradicional de Pago con Tarjeta y Opción CFDI -->
    <div id="modal-checkout" class="modal">
        <div class="modal-content" style="max-width: 420px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.2rem;">
                <h3 style="color: var(--secondary-color); font-size: 1.15rem;"><i class="fa-solid fa-credit-card"></i> Pasarela de Pago</h3>
                <span id="close-checkout-modal" style="cursor:pointer; font-size: 1.2rem; color: var(--text-muted);"><i class="fa-solid fa-xmark"></i></span>
            </div>
            
            <form id="form-checkout">
                <!-- Nombre del Titular -->
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.3rem;">Nombre del Titular</label>
                    <input type="text" id="pay-name" class="form-control" placeholder="Como aparece en la tarjeta" required>
                </div>

                <!-- Número de Tarjeta (Solo Números) -->
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.3rem;">Número de Tarjeta</label>
                    <input type="text" id="pay-card" class="form-control" placeholder="4532 0000 0000 0000" maxlength="19" required>
                </div>

                <!-- Expiración y CVC -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem;">
                    <div class="form-group">
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.3rem;">Vencimiento</label>
                        <input type="text" id="pay-expiry" class="form-control" placeholder="MM/AA" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.3rem;">CVC / CVV</label>
                        <input type="text" id="pay-cvc" class="form-control" placeholder="123" maxlength="4" required>
                    </div>
                </div>

                <!-- Opción de Facturación CFDI 4.0 -->
                <div style="background: #f8fafc; border: 1px solid var(--border-color); padding: 0.8rem; border-radius: 6px; margin-bottom: 1.2rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--secondary-color);">
                        <input type="checkbox" id="check-invoice"> ¿Requieres Factura CFDI 4.0?
                    </label>

                    <div id="invoice-fields" style="display: none; margin-top: 0.8rem;">
                        <div class="form-group" style="margin-bottom: 0.8rem;">
                            <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.2rem;">RFC del Receptor</label>
                            <input type="text" id="pay-rfc" class="form-control" placeholder="XAXX010101000" maxlength="13" style="font-size: 0.85rem; text-transform: uppercase;">
                        </div>
                        <div class="form-group">
                            <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 0.2rem;">Uso de CFDI</label>
                            <select id="pay-cfdi-use" class="form-control" style="font-size: 0.85rem;">
                                <option value="G03">G03 - Gastos en general</option>
                                <option value="D01">D01 - Honorarios médicos y hospitalarios</option>
                                <option value="S01">S01 - Sin efectos fiscales</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;">Confirmar Pago</button>
            </form>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem("fp_cart")) || [];
        let favorites = JSON.parse(localStorage.getItem("fp_favs")) || [];
        let discountRate = 0;

        document.addEventListener("DOMContentLoaded", () => {
            renderCart();
            updateBadges();

            const applyCouponBtn = document.getElementById("apply-coupon-btn");
            if (applyCouponBtn) {
                applyCouponBtn.addEventListener("click", () => {
                    const code = document.getElementById("coupon-input").value.trim().toUpperCase();
                    if (code === "FAMILY10") {
                        discountRate = 0.10;
                        alert("¡Cupón aplicado con éxito (10% de descuento)!");
                        renderCart();
                    } else {
                        alert("Cupón inválido o expirado.");
                        discountRate = 0;
                        renderCart();
                    }
                });
            }

            const checkoutModal = document.getElementById("modal-checkout");
            const checkoutBtn = document.getElementById("checkout-btn");
            const closeCheckoutBtn = document.getElementById("close-checkout-modal");
            const checkInvoice = document.getElementById("check-invoice");
            const invoiceFields = document.getElementById("invoice-fields");

            // Mostrar/Ocultar campos de Factura según la casilla
            if (checkInvoice && invoiceFields) {
                checkInvoice.addEventListener("change", () => {
                    invoiceFields.style.display = checkInvoice.checked ? "block" : "none";
                });
            }

            // MÁSCARA ESTRICTA DE TARJETA (Solo permite números y agrupa de 4 en 4)
            const payCardInput = document.getElementById("pay-card");
            if (payCardInput) {
                payCardInput.addEventListener("input", (e) => {
                    let value = e.target.value.replace(/\D/g, ''); 
                    value = value.replace(/(.{4})/g, '$1 ').trim(); 
                    e.target.value = value.substring(0, 19);
                });
            }

            // Máscara para fecha de vencimiento (MM/AA)
            const payExpiryInput = document.getElementById("pay-expiry");
            if (payExpiryInput) {
                payExpiryInput.addEventListener("input", (e) => {
                    let value = e.target.value.replace(/\D/g, '');
                    if (value.length >= 3) {
                        value = value.substring(0, 2) + '/' + value.substring(2, 4);
                    }
                    e.target.value = value.substring(0, 5);
                });
            }

            // Máscara solo números para CVC
            const payCvcInput = document.getElementById("pay-cvc");
            if (payCvcInput) {
                payCvcInput.addEventListener("input", (e) => {
                    e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
                });
            }

            if (checkoutBtn) {
                checkoutBtn.addEventListener("click", () => {
                    if (cart.length === 0) {
                        alert("Tu carrito está vacío.");
                        return;
                    }
                    if (checkoutModal) checkoutModal.style.display = "flex";
                });
            }

            if (closeCheckoutBtn && checkoutModal) {
                closeCheckoutBtn.addEventListener("click", () => {
                    checkoutModal.style.display = "none";
                });
            }

            window.addEventListener("click", (e) => {
                if (e.target === checkoutModal) checkoutModal.style.display = "none";
            });

            const formCheckout = document.getElementById("form-checkout");
            if (formCheckout) {
                formCheckout.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const card = document.getElementById("pay-card").value.replace(/\s/g, '');
                    const name = document.getElementById("pay-name").value.trim();

                    if (card.length < 15) {
                        alert("El número de tarjeta debe contener al menos 15 o 16 dígitos.");
                        return;
                    }

                    let message = `¡Pago de ${document.getElementById("summary-total").textContent} procesado con éxito!\n\nGracias por tu compra, ${name}.`;

                    if (checkInvoice && checkInvoice.checked) {
                        const rfc = document.getElementById("pay-rfc").value.trim().toUpperCase();
                        const cfdiUse = document.getElementById("pay-cfdi-use").value;
                        if (!rfc || rfc.length < 12) {
                            alert("Por favor ingresa un RFC válido de 12 o 13 caracteres.");
                            return;
                        }
                        message += `\n\nFactura CFDI 4.0 generada a favor de:\nRFC: ${rfc}\nUso de CFDI: ${cfdiUse}`;
                    }

                    alert(message);

                    localStorage.removeItem("fp_cart");
                    cart = [];
                    window.location.href = "index.html";
                });
            }
        });

        function renderCart() {
            const container = document.getElementById("cart-items-container");
            if (!container) return;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                        <i class="fa-solid fa-cart-shopping" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.3;"></i>
                        <p style="font-size: 1rem; margin-bottom: 1rem;">No tienes productos en tu carrito.</p>
                        <a href="index.html" class="btn btn-primary">Ir al Catálogo</a>
                    </div>
                `;
                updateSummary(0);
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem;">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <img src="${item.img}" alt="${item.name}" style="width: 60px; height: 60px; object-fit: contain; background: #f8fafc; border-radius: 6px; border: 1px solid var(--border-color);">
                        <div>
                            <h4 style="font-size: 0.95rem; color: var(--secondary-color); margin-bottom: 0.2rem;">${item.name}</h4>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">$${item.price.toFixed(2)} MXN c/u</p>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <div style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                            <button onclick="changeQty(${index}, -1)" style="background:none; border:none; padding: 0.3rem 0.6rem; cursor:pointer;"><i class="fa-solid fa-minus"></i></button>
                            <span style="padding: 0 0.5rem; font-weight:600; font-size: 0.9rem;">${item.quantity || 1}</span>
                            <button onclick="changeQty(${index}, 1)" style="background:none; border:none; padding: 0.3rem 0.6rem; cursor:pointer;"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        <span style="font-weight: bold; color: var(--primary); font-size: 0.95rem; min-width: 80px; text-align: right;">$${((item.price) * (item.quantity || 1)).toFixed(2)}</span>
                        <button onclick="removeItem(${index})" style="background:none; border:none; color: var(--accent-red); cursor:pointer; font-size: 1rem;" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join("");

            let subtotal = cart.reduce((acc, item) => acc + (item.price * (item.quantity || 1)), 0);
            updateSummary(subtotal);
        }

        function changeQty(index, delta) {
            let currentQty = cart[index].quantity || 1;
            currentQty += delta;
            if (currentQty <= 0) {
                cart.splice(index, 1);
            } else if (currentQty > 20) {
                alert("El límite máximo por producto es de 20 unidades.");
                return;
            } else {
                cart[index].quantity = currentQty;
            }
            localStorage.setItem("fp_cart", JSON.stringify(cart));
            renderCart();
            updateBadges();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem("fp_cart", JSON.stringify(cart));
            renderCart();
            updateBadges();
        }

        function updateSummary(subtotal) {
            // Envío gratis a partir de $350.00 MXN
            const shipping = (subtotal >= 350.00) ? 0.00 : (subtotal > 0 ? 50.00 : 0.00);
            let discount = subtotal * discountRate;
            let total = subtotal + shipping - discount;

            document.getElementById("summary-subtotal").textContent = `$${subtotal.toFixed(2)} MXN`;
            
            const shippingSpan = document.getElementById("summary-shipping");
            if (shipping === 0.00 && subtotal > 0) {
                shippingSpan.innerHTML = `<span style="color: var(--accent-green); font-weight: 600;">¡Gratis!</span>`;
            } else {
                shippingSpan.textContent = `$${shipping.toFixed(2)} MXN`;
            }

            const discountRow = document.getElementById("discount-row");
            if (discountRate > 0) {
                discountRow.style.display = "flex";
                document.getElementById("summary-discount").textContent = `-$${discount.toFixed(2)} MXN`;
            } else {
                discountRow.style.display = "none";
            }

            document.getElementById("summary-total").textContent = `$${total.toFixed(2)} MXN`;
        }

        function updateBadges() {
            const cartBadges = document.querySelectorAll("#cart-badge");
            const favBadges = document.querySelectorAll("#fav-badge");
            const totalCartItems = cart.reduce((acc, i) => acc + (i.quantity || 1), 0);
            
            cartBadges.forEach(b => b.textContent = totalCartItems);
            favBadges.forEach(b => b.textContent = favorites.length);
        }
    </script>
</body>
</html>
