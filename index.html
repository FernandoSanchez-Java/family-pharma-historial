<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Pharma - Catálogo V5</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --accent: #10b981;
      --bg-color: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --white: #ffffff;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--white);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-bar {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 768px) {
      .catalog-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }

    @media (min-width: 1024px) {
      .catalog-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .product-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .product-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }

    .btn-primary:active {
      background-color: var(--primary-dark);
    }

    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--white);
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
      box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.05);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: none;
      gap: 2px;
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo">💊 Family Pharma</div>
      <div id="branch-indicator" style="font-size: 0.8rem; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px;">
        Sucursal: Centro
      </div>
    </div>
    <input type="text" id="searchInput" class="search-bar" placeholder="Buscar medicamento o síntoma...">
  </header>

  <main class="container">
    <div id="productCatalog" class="catalog-grid">
      <!-- Aquí puedes mantener o enlazar tu script de productos habitual -->
    </div>
  </main>

  <nav class="mobile-nav">
    <a href="#" class="nav-item active">
      <span>🏠</span> Inicio
    </a>
    <a href="favoritos.html" class="nav-item">
      <span>⭐</span> Favoritos
    </a>
    <a href="carrito.html" class="nav-item">
      <span>🛒</span> Carrito
    </a>
    <a href="#" class="nav-item" id="nav-cfdi">
      <span>📄</span> Factura
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
