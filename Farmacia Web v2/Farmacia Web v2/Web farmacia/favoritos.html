<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITA Farmacia - Mis Favoritos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-plus"></i> VITA Farmacia
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Catálogo</a></li>
            </ul>
            <div class="nav-actions">
                <a href="favoritos.html" class="icon-btn" title="Favoritos"><i class="fa-solid fa-heart" style="color:var(--accent-red)"></i></a>
                <a href="carrito.html" class="icon-btn" title="Carrito"><i class="fa-solid fa-bag-shopping"></i></a>
            </div>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
        <h2 class="section-title">Mis Productos Favoritos</h2>

        <div class="grid-products">
            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1584017911766-d451b3d0e843?auto=format&fit=crop&w=400&q=80" alt="Paracetamol">
                </div>
                <div class="product-content">
                    <span class="product-category">Analgésico</span>
                    <h3 class="product-name">Paracetamol 500mg</h3>
                    <div class="product-price">$85.00 MXN</div>
                    <div class="product-buttons">
                        <button class="btn btn-primary">Mover al carrito</button>
                        <button class="btn btn-outline" style="color: var(--accent-red);"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=400&q=80" alt="Vitamina C">
                </div>
                <div class="product-content">
                    <span class="product-category">Vitaminas</span>
                    <h3 class="product-name">Vitamina C Efervescente</h3>
                    <div class="product-price">$140.00 MXN</div>
                    <div class="product-buttons">
                        <button class="btn btn-primary">Mover al carrito</button>
                        <button class="btn btn-outline" style="color: var(--accent-red);"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
